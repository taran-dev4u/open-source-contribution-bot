name: Open-Source Cloud Autonomous Runner

on:
  schedule:
    # Runs every 2 hours in the cloud (24/7 without local PC dependence)
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: open-source-cloud-runner
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

      - name: Run Cloud Monitoring & Synchronization Cycle
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.main --once

      - name: Persist telemetry and portfolio state
        shell: bash
        run: |
          git config user.name "Taran Mamidala"
          git config user.email "mamidalataran6333@gmail.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
            exit 0
          fi
          git commit -m "chore(telemetry): update open-source portfolio status [skip ci]"
          git pull --rebase origin main || true
          git push origin main
